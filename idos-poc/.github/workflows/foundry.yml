name: Reproduce Gas DoS and Stale Slashed Stake PoCs

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  foundry-test:
    name: Foundry Test - Gas DoS and Stale Slashed Stake PoCs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std --no-commit
          forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Run Gas DoS PoC tests
        run: |
          forge test -vvv --match-test "test_GasDoS"

      - name: Run Stale Slashed Stake PoC tests
        run: |
          forge test -vvv --match-test "test_StaleSlashedStake"
