name: Verify Staking Finding 5

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch audit report
        run: |
          curl -fsSL https://raw.githubusercontent.com/idos-network/contracts/ebbae56b3bf3598dc9794032dd3df37c772cfe8d/NM0731-FINAL_IDOS.pdf -o audit.pdf
          pdftotext -layout audit.pdf audit.txt
      - name: Print finding 5 context
        run: |
          grep -n -i 'Users can evade slashing penalties' audit.txt
          echo '=== FULL CONTEXT ==='
          n=$(grep -n -i 'Users can evade slashing penalties' audit.txt | tail -1 | cut -d: -f1)
          sed -n "$((n-5)),$((n+80))p" audit.txt
