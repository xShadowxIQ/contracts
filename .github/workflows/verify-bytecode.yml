name: Verify Deployed Bytecode Matches Source

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  bytecode-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Fetch on-chain runtime bytecode (Arbitrum Sepolia - the actual staking deployment)
        run: |
          python3 .github/scripts/fetch_code.py \
            0xA07742fd930A8dF8dF35eE483aEe933545f84378 onchain.hex

      - name: Compile from source with the deployed solc version
        run: |
          set -euo pipefail
          # Isolate src/ so the solc pin in test/ does not force a different version.
          mkdir -p /tmp/hold
          mv test script /tmp/hold/
          forge soldeer install
          # 0.8.28 is the compiler recorded in the on-chain metadata.
          forge build --use 0.8.28 --optimize --optimizer-runs 200 --skip script
          mv /tmp/hold/test /tmp/hold/script .

      - name: Compare compiled runtime bytecode with on-chain
        run: |
          python3 .github/scripts/compare_bytecode.py \
            out/IDOSNodeStaking.sol/IDOSNodeStaking.json onchain.hex IDOSNodeStaking \
            | tee parity.txt
          echo ""
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat parity.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"