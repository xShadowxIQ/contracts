name: Security Fuzz - Accounting

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: forge soldeer install
      - name: Run fuzz test
        run: forge test --match-path test/SecurityAccountingFuzz.t.sol --match-test testFuzz_AccountingAndRewardConservation -vv
