name: Security Static Analysis (In-Scope Only)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      # The earlier attempt used the crytic/slither-action wrapper, which crashed
      # crytic-compile while recursing through the continuous-clearing-auction
      # submodule tree (v4-periphery -> solmate -> ds-test -> ...). We now install
      # Slither directly and analyse ONLY the three in-scope bounty files.
      - name: Install Slither
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet slither-analyzer solc-select
          slither --version

      - name: Build in-scope contracts
        run: |
          forge soldeer install
          forge build --skip test --skip script

      - name: Analyse the three in-scope contracts
        run: |
          mkdir -p .slither-out
          for pair in "IDOSNodeStaking:IDOSNodeStaking" "IDOSToken:IDOSToken" "IDOSVesting:IDOSVesting"; do
            file="${pair%%:*}"
            echo ""
            echo "################ $file ################"
            slither "src/$file.sol" \
              --solc-remaps '@openzeppelin/=dependencies/@openzeppelin-contracts-5.5.0/' \
              --foundry-out-directory out \
              --exclude-dependencies \
              --exclude naming-convention,solc-version \
              --json ".slither-out/$file.json" > ".slither-out/$file.txt" 2>&1 || true
            python3 .github/scripts/slither_summary.py ".slither-out/$file.json" || tail -20 ".slither-out/$file.txt"
          done

      - name: Publish detector summary as job summary
        run: |
          {
            echo "## Slither - in-scope contracts only"
            for f in IDOSNodeStaking IDOSToken IDOSVesting; do
              echo ""
              echo "### $f"
              echo '```'
              python3 .github/scripts/slither_summary.py ".slither-out/$f.json" || tail -20 ".slither-out/$f.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"