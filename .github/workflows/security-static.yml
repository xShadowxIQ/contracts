name: Security Static Analysis

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: forge soldeer install
      - name: Install Slither
        run: pipx install slither-analyzer
      - name: Run Slither
        run: |
          for f in src/IDOSNodeStaking.sol src/IDOSVesting.sol src/IDOSToken.sol; do
            base=$(basename "$f" .sol)
            echo "===== $f ====="
            slither "$f" --exclude-dependencies --json "$base.json"
            jq -r '.results.detectors[] | [.check,.impact,.confidence,.description] | @tsv' "$base.json" || true
          done
