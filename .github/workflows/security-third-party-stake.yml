name: Security PoC - Third Party Stake

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  third-party-stake-poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Install dependencies
        run: forge soldeer install

      - name: PoC - unauthorised third party spends victim allowance in stake()
        run: forge test --match-path "test/SecurityThirdPartyStake.t.sol" -vv

      - name: Invariant - solvency and reward conservation
        run: forge test --match-path "test/SecuritySolvencyInvariant.t.sol" -vv

      - name: Invariant - reward conservation under changing epoch reward
        run: forge test --match-path "test/SecurityRewardConservation.t.sol" -vv

      - name: Griefing and view-function robustness
        run: forge test --match-path "test/SecurityGriefingAndViews.t.sol" -vv

      - name: IDOSVesting review
        run: forge test --match-path "test/SecurityVestingReview.t.sol" -vv

      - name: Regression - full in-scope suite
        run: forge test --match-path "test/{IDOSNodeStaking,IDOSVesting,IDOSToken,Security*}*.sol"