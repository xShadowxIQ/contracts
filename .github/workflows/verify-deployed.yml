name: Verify Deployed Contract Matches Upstream Source

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-deployed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Install dependencies
        run: forge soldeer install

      - name: Fetch on-chain runtime bytecode via JSON-RPC
        run: |
          set -uo pipefail
          fetch_code() {
            local addr="$1"
            for u in https://arb1.arbitrum.io/rpc \
                     https://arbitrum-one-rpc.publicnode.com \
                     https://arbitrum.drpc.org \
                     https://1rpc.io/arb \
                     https://arbitrum.meowrpc.com \
                     https://arb-pokt.nodies.app; do
              resp=$(curl -s --max-time 25 -X POST "$u" \
                -H 'Content-Type: application/json' \
                --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getCode\",\"params\":[\"$addr\",\"latest\"]}" || true)
              code=$(printf '%s' "$resp" | python3 -c "import sys,json
          try:
              d=json.load(sys.stdin); print(d.get('result','') or '')
          except Exception:
              print('')" 2>/dev/null || true)
              if [ "${#code}" -gt 1000 ]; then
                echo "$u"
                printf '%s' "$code" > "code_$addr.hex"
                return 0
              fi
              echo "  miss $u (${#code} chars)" >&2
            done
            return 1
          }

          STAKING=0x6132F2EE66deC6bdf416BDA9588D663AeCeec337
          TOKEN=0x68731d6F14B827bBCfFbEBb62b19Daa18de1d79c

          echo "=== fetching IDOSNodeStaking $STAKING ==="
          if U=$(fetch_code "$STAKING"); then
            echo "ok via $U -> $(( ($(wc -c < code_$STAKING.hex)) / 2 )) bytes"
          else
            echo "FAILED to fetch staking bytecode"
          fi

          echo "=== fetching IDOSToken $TOKEN ==="
          if U=$(fetch_code "$TOKEN"); then
            echo "ok via $U -> $(( ($(wc -c < code_$TOKEN.hex)) / 2 )) bytes"
          else
            echo "FAILED to fetch token bytecode"
          fi

          ls -la code_*.hex 2>/dev/null || echo "no bytecode files"

      - name: Compare on-chain dispatcher against upstream master ABI
        run: |
          set -uo pipefail
          STAKING=0x6132F2EE66deC6bdf416BDA9588D663AeCeec337
          TOKEN=0x68731d6F14B827bBCfFbEBb62b19Daa18de1d79c

          compare() {
            local src="$1" contract="$2" name="$3" hexfile="$4"
            [ -s "$hexfile" ] || { echo "$name: no bytecode captured, skipping"; return 0; }

            forge inspect "$src:$contract" methodIdentifiers \
              | grep -oE '\| [0-9a-f]{8}' | tr -d '| ' | sort -u > "${name}_src.txt"

            # scan the dispatcher region for PUSH4 (0x63) immediates
            head -c 9000 "$hexfile" | grep -oE '63[0-9a-f]{8}' | cut -c3- | sort -u > "${name}_dep.txt"

            echo "----- $name -----"
            echo "source selectors : $(wc -l < ${name}_src.txt)"
            echo "on-chain selectors: $(wc -l < ${name}_dep.txt)"
            echo "solc (metadata)  : $(tail -c 20 "$hexfile")"
            if diff -u "${name}_src.txt" "${name}_dep.txt"; then
              echo "RESULT $name: on-chain selectors MATCH upstream master surface (superset check below)"
            else
              echo "RESULT $name: DIFFERENCES above (inspect manually)"
            fi
            echo "-- presence of each source selector on-chain --"
            while read -r s; do
              if grep -q "^$s$" "${name}_dep.txt"; then echo "FOUND    $s"; else echo "MISSING  $s"; fi
            done < "${name}_src.txt"
          }

          compare src/IDOSNodeStaking.sol IDOSNodeStaking staking "code_$STAKING.hex"
          compare src/IDOSToken.sol IDOSToken token "code_$TOKEN.hex"
          compare src/IDOSVesting.sol IDOSVesting vesting "code_missing.hex"