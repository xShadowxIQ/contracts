name: Inspect idOS audit
on:
  push:
    branches: [master]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download audit
        run: |
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/NethermindEth/PublicAuditReports/main/NM0731-FINAL_IDOS.pdf -o audit.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -layout audit.pdf audit.txt
      - name: Search audit for staking/slashing semantics
        run: |
          echo '=== MATCHES: unstake/unbond/slash/withdraw/delay/pending ==='
          grep -niE 'unstake|unbond|slash|slashing|withdraw|delay|pending' audit.txt | head -n 250 || true
          echo '=== MATCHES: severity/finding identifiers ==='
          grep -niE 'critical|high|medium|low|ID-' audit.txt | head -n 250 || true
          echo '=== HEADINGS / TOC ==='
          grep -niE 'finding|issue|executive summary|scope|conclusion' audit.txt | head -n 200 || true
