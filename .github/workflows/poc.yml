name: Foundry PoC

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Install dependencies
        run: forge soldeer install
      - name: Run reward-accounting PoC
        run: forge test --match-test test_Rewards_EpochRewardsComputation -vvvv
